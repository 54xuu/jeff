<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#063216" flood-opacity="0.22" />
    </filter>
    
    <!-- Glow filter for sparkles -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Main watermelon body gradient: rich vibrant green -->
    <radialGradient id="melon-body" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="18%" stop-color="#4ade80" />
      <stop offset="55%" stop-color="#22c55e" />
      <stop offset="82%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <!-- Body top-left specular highlight -->
    <linearGradient id="body-highlight" x1="25%" y1="0%" x2="45%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Dark green watermelon stripes gradient -->
    <linearGradient id="stripe-grad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <!-- Vine and leaf gradient -->
    <linearGradient id="stem-grad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>

    <linearGradient id="leaf-grad-right" x1="0%" y1="80%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="85%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>

    <!-- Cheeks blush gradient -->
    <radialGradient id="blush-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </radialGradient>

    <!-- Watermelon slice flesh gradient -->
    <radialGradient id="slice-flesh" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ff4365" />
      <stop offset="55%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>

    <!-- Limbs gradient -->
    <radialGradient id="limb-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- Clip path for stripes to stay strictly inside the cute watermelon body -->
    <clipPath id="body-clip">
      <path d="M 256,108 C 382,108 432,185 432,292 C 432,388 365,436 256,436 C 147,436 80,388 80,292 C 80,185 130,108 256,108 Z" />
    </clipPath>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="256" cy="450" rx="145" ry="18" fill="#04200e" opacity="0.16" />
  <ellipse cx="256" cy="450" rx="95" ry="11" fill="#04200e" opacity="0.12" />

  <!-- Little feet -->
  <g id="feet">
    <!-- Left foot -->
    <g transform="translate(194, 430)">
      <ellipse cx="0" cy="0" rx="32" ry="21" fill="url(#limb-grad)" />
      <path d="M -16,-8 C -4,-16 14,-15 22,-6" stroke="#d1fae5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>
    <!-- Right foot -->
    <g transform="translate(318, 430)">
      <ellipse cx="0" cy="0" rx="32" ry="21" fill="url(#limb-grad)" />
      <path d="M -22,-6 C -14,-15 4,-16 16,-8" stroke="#d1fae5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>
  </g>

  <!-- Watermelon body with soft shadow -->
  <g id="body-group" filter="url(#soft-shadow)">
    <!-- Body base shape -->
    <path id="body-base" d="M 256,108 C 382,108 432,185 432,292 C 432,388 365,436 256,436 C 147,436 80,388 80,292 C 80,185 130,108 256,108 Z" fill="url(#melon-body)" />

    <!-- Stripes clipped cleanly inside body (Organic flowing curves on sides, leaving face clean & cute) -->
    <g clip-path="url(#body-clip)" opacity="0.92">
      <!-- Stripe 1: Far left stripe -->
      <path d="M 124,120 Q 98,185 120,250 T 96,355 Q 102,405 122,434" fill="none" stroke="url(#stripe-grad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Stripe 2: Mid-left stripe (curves gently around left eye and cheek) -->
      <path d="M 186,112 Q 155,178 166,240 T 142,335 Q 146,395 168,436" fill="none" stroke="url(#stripe-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Stripe 3: Mid-right stripe (curves gently around right eye and cheek) -->
      <path d="M 326,112 Q 357,178 346,240 T 370,335 Q 366,395 344,436" fill="none" stroke="url(#stripe-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Stripe 4: Far right stripe -->
      <path d="M 388,120 Q 414,185 392,250 T 416,355 Q 410,405 390,434" fill="none" stroke="url(#stripe-grad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Specular highlight overlay (top-left glossy curved reflection) -->
    <path d="M 256,120 C 350,120 400,175 408,252 C 378,168 316,136 230,136 C 166,136 128,166 108,214 C 122,154 174,120 256,120 Z" fill="url(#body-highlight)" />

    <!-- Inner rim light along bottom-left -->
    <path d="M 112,230 C 96,285 102,348 128,390" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.32" />
  </g>

  <!-- Head stem and tender leaves (Charming melon vine) -->
  <g id="head-sprout">
    <!-- Stem button / base ring -->
    <ellipse cx="256" cy="110" rx="15" ry="8" fill="#14532d" />
    <ellipse cx="256" cy="109" rx="11" ry="5.5" fill="#166534" />

    <!-- Playful curly vine tendril -->
    <path d="M 256,108 C 255,75 236,56 248,34 C 256,20 278,20 284,36 C 288,52 274,64 265,60 C 257,55 259,45 268,45" fill="none" stroke="url(#stem-grad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="268" cy="45" r="3.5" fill="#4ade80" />

    <!-- Main Watermelon Leaf (spreading gracefully to the left) -->
    <g filter="url(#soft-shadow)">
      <path d="M 250,105 C 205,96 178,60 182,38 C 208,40 236,68 252,98 Z" fill="url(#leaf-grad)" />
      <!-- Leaf center vein & delicate side veins -->
      <path d="M 246,96 Q 220,72 196,48" stroke="#15803d" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 226,80 Q 210,80 202,74" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 212,65 Q 198,63 192,57" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Leaf glossy edge -->
      <path d="M 186,41 C 196,54 220,76 246,92" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45" />
    </g>

    <!-- Secondary Watermelon Leaf (perking up to the right) -->
    <g filter="url(#soft-shadow)">
      <path d="M 259,105 C 290,96 312,74 314,56 C 295,58 276,78 261,100 Z" fill="url(#leaf-grad-right)" />
      <path d="M 264,98 Q 288,80 306,62" stroke="#15803d" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 280,85 Q 292,86 298,80" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Facial System (Warm, expressive, high-cuteness ratio) -->
  <g id="face">
    <!-- Gentle, happy eyebrows -->
    <path d="M 178,195 C 188,188 206,190 216,197" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 334,195 C 324,188 306,190 296,197" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round" />

    <!-- Left eye -->
    <g id="left-eye">
      <!-- Eye base dark iris -->
      <ellipse cx="196" cy="235" rx="23" ry="27" fill="#062412" />
      <!-- Bottom vibrant emerald sparkle -->
      <path d="M 178,244 C 182,257 210,257 214,244 C 206,254 186,254 178,244 Z" fill="#10b981" />
      <!-- Star-like bottom accent -->
      <circle cx="196" cy="252" r="2.5" fill="#6ee7b7" />
      <!-- Primary reflection shine -->
      <ellipse cx="187" cy="223" rx="9" ry="10" fill="#ffffff" />
      <!-- Secondary reflection shine -->
      <circle cx="207" cy="244" r="5" fill="#ffffff" />
      <circle cx="184" cy="244" r="2" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Right eye -->
    <g id="right-eye">
      <!-- Eye base dark iris -->
      <ellipse cx="316" cy="235" rx="23" ry="27" fill="#062412" />
      <!-- Bottom vibrant emerald sparkle -->
      <path d="M 298,244 C 302,257 330,257 334,244 C 326,254 306,254 298,244 Z" fill="#10b981" />
      <!-- Star-like bottom accent -->
      <circle cx="316" cy="252" r="2.5" fill="#6ee7b7" />
      <!-- Primary reflection shine -->
      <ellipse cx="307" cy="223" rx="9" ry="10" fill="#ffffff" />
      <!-- Secondary reflection shine -->
      <circle cx="327" cy="244" r="5" fill="#ffffff" />
      <circle cx="304" cy="244" r="2" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Rosy blushing cheeks -->
    <ellipse cx="160" cy="265" rx="28" ry="17" fill="url(#blush-grad)" />
    <ellipse cx="352" cy="265" rx="28" ry="17" fill="url(#blush-grad)" />
    <!-- Anime twinkle blush marks -->
    <path d="M 148,266 L 158,261 M 163,269 L 173,264" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 339,264 L 349,269 M 354,261 L 364,266" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Cheerful open-smile mouth -->
    <g id="mouth">
      <clipPath id="mouth-inner-clip">
        <path d="M 230,255 C 230,255 243,262 256,262 C 269,262 282,255 282,255 C 284,272 276,300 256,300 C 236,300 228,272 230,255 Z" />
      </clipPath>
      
      <!-- Inside mouth dark pinkish red -->
      <path d="M 230,255 C 230,255 243,262 256,262 C 269,262 282,255 282,255 C 284,272 276,300 256,300 C 236,300 228,272 230,255 Z" fill="#881337" />
      
      <!-- Sweet pink melon tongue -->
      <path clip-path="url(#mouth-inner-clip)" d="M 240,278 C 240,268 272,268 272,278 C 272,295 240,295 240,278 Z" fill="#fb7185" />
      <path clip-path="url(#mouth-inner-clip)" d="M 246,278 C 246,273 266,273 266,278" stroke="#fecdd3" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />
      
      <!-- Upper lip line (cat-like friendly curve) -->
      <path d="M 227,255 C 236,261 247,263 256,259 C 265,263 276,261 285,255" fill="none" stroke="#0f3d1e" stroke-width="4.5" stroke-linecap="round" />
      <!-- Lower jaw outline -->
      <path d="M 230,255 C 228,272 236,300 256,300 C 276,300 284,272 282,255" fill="none" stroke="#0f3d1e" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Held juicy watermelon slice (Centerpiece of the watermelon theme) -->
  <g id="held-watermelon-slice" filter="url(#soft-shadow)">
    <!-- Outer rind: deep green -->
    <path d="M 192,318 C 214,378 298,378 320,318 Q 256,338 192,318 Z" fill="#15803d" />
    <!-- Mid rind: crisp pale jade / white rind -->
    <path d="M 196,318 C 217,371 295,371 316,318 Q 256,336 196,318 Z" fill="#dcfce7" />
    <!-- Sweet red watermelon flesh -->
    <path d="M 200,318 C 220,364 292,364 312,318 Q 256,333 200,318 Z" fill="url(#slice-flesh)" />
    <!-- Top edge crisp highlight on red flesh -->
    <path d="M 206,321 Q 256,332 306,321" stroke="#fda4af" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    
    <!-- Watermelon seeds (Glossy drop shapes) -->
    <!-- Seed 1 -->
    <path d="M 226,328 C 223,333 227,338 230,338 C 233,338 234,333 230,328 Z" fill="#090d16" />
    <circle cx="228" cy="332" r="0.9" fill="#ffffff" />
    
    <!-- Seed 2 (Left-center) -->
    <path d="M 244,335 C 241,340 245,345 248,345 C 251,345 252,340 248,335 Z" fill="#090d16" />
    <circle cx="246" cy="339" r="0.9" fill="#ffffff" />

    <!-- Seed 3 (Right-center) -->
    <path d="M 268,335 C 265,340 269,345 272,345 C 275,345 276,340 272,335 Z" fill="#090d16" />
    <circle cx="270" cy="339" r="0.9" fill="#ffffff" />

    <!-- Seed 4 -->
    <path d="M 286,328 C 283,333 287,338 290,338 C 293,338 294,333 290,328 Z" fill="#090d16" />
    <circle cx="288" cy="332" r="0.9" fill="#ffffff" />
  </g>

  <!-- Chubby little hands holding the slice lovingly -->
  <g id="hands">
    <!-- Left little hand -->
    <g transform="translate(192, 326) rotate(-18)">
      <ellipse cx="0" cy="0" rx="22" ry="17" fill="url(#limb-grad)" />
      <path d="M -10,-8 C -2,-14 10,-12 16,-4" stroke="#d1fae5" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>
    <!-- Right little hand -->
    <g transform="translate(320, 326) rotate(18)">
      <ellipse cx="0" cy="0" rx="22" ry="17" fill="url(#limb-grad)" />
      <path d="M -16,-4 C -10,-12 2,-14 10,-8" stroke="#d1fae5" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>
  </g>

  <!-- Magical sparkles & inspiration stars (Jeff AI energy) -->
  <g id="sparkles">
    <!-- Main golden spark (top-right) -->
    <path d="M 412,132 Q 412,154 434,154 Q 412,154 412,176 Q 412,154 390,154 Q 412,154 412,132 Z" fill="#facc15" filter="url(#glow)" />
    <circle cx="412" cy="154" r="3.5" fill="#ffffff" />

    <!-- Fresh green sparkle (top-left) -->
    <path d="M 104,152 Q 104,166 118,166 Q 104,166 104,180 Q 104,166 90,166 Q 104,166 104,152 Z" fill="#4ade80" opacity="0.9" />
    
    <!-- Ambient glowing dots -->
    <circle cx="442" cy="202" r="4.5" fill="#fbbf24" opacity="0.8" />
    <circle cx="425" cy="225" r="2.5" fill="#fde047" opacity="0.6" />
    <circle cx="80" cy="215" r="3.5" fill="#86efac" opacity="0.75" />
  </g>
</svg>
